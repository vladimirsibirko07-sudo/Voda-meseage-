        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            width: 100%;
            min-height: 100%;
        }

        body {
            font-family: Arial, sans-serif;
            color: white;
            background:
                radial-gradient(circle at 20% 20%, #38d9ff 0%, transparent 28%),
                radial-gradient(circle at 80% 80%, #0066ff 0%, transparent 30%),
                linear-gradient(135deg, #021b35, #064b78, #00a6c7);

            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* Светящиеся пятна */

        body::before,
        body::after {
            content: "";
            position: fixed;
            width: 400px;
            height: 400px;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.35;
            pointer-events: none;
        }

        body::before {
            background: #00eaff;
            top: -150px;
            left: -150px;
        }

        body::after {
            background: #006eff;
            bottom: -150px;
            right: -150px;
        }

        /* Волны */

        .waves {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 180px;
            overflow: hidden;
            pointer-events: none;
        }

        .wave {
            position: absolute;
            left: -10%;
            width: 120%;
            height: 100px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.08);
            animation: wave 7s ease-in-out infinite alternate;
        }

        .wave:nth-child(1) {
            bottom: 70px;
        }

        .wave:nth-child(2) {
            bottom: 25px;
            animation-duration: 9s;
            opacity: 0.7;
        }

        .wave:nth-child(3) {
            bottom: -20px;
            animation-duration: 11s;
            opacity: 0.5;
        }

        @keyframes wave {
            from {
                transform: translateX(-4%) rotate(-2deg);
            }

            to {
                transform: translateX(4%) rotate(2deg);
            }
        }

        /* Пузырьки */

        .bubble {
            position: fixed;
            bottom: -100px;
            width: 15px;
            height: 15px;
            border: 2px solid rgba(255,255,255,0.35);
            border-radius: 50%;
            animation: bubble 8s linear infinite;
            pointer-events: none;
        }

        .bubble:nth-child(1) {
            left: 10%;
            animation-delay: 1s;
            width: 12px;
            height: 12px;
        }

        .bubble:nth-child(2) {
            left: 30%;
            animation-delay: 4s;
            width: 20px;
            height: 20px;
        }

        .bubble:nth-child(3) {
            left: 55%;
            animation-delay: 2s;
            width: 10px;
            height: 10px;
        }

        .bubble:nth-child(4) {
            left: 75%;
            animation-delay: 5s;
            width: 25px;
            height: 25px;
        }

        .bubble:nth-child(5) {
            left: 90%;
            animation-delay: 3s;
            width: 14px;
            height: 14px;
        }

        @keyframes bubble {
            0% {
                transform: translateY(0) scale(1);
                opacity: 0;
            }

            10% {
                opacity: 1;
            }

            100% {
                transform: translateY(-110vh) scale(1.4);
                opacity: 0;
            }
        }

        /* Основная карточка */

        .container {

        }

        p {

        }

        /* Кнопка */

        .download {

            transition:
                transform 0.25s ease,

        }

        .download:hover {

            box-shadow:
                0 15px 40px rgba(0, 0, 0, 0.3),

        }

        .download:active {

        .download-icon {
            font-size: 24px;
        }

        /* Информация о файле */

        .file {

        .version {

        /* Мобильная версия */

            }

                min-width: 0;
            }
        }
    </style>
